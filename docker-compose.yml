services:
  squash-bot:
    image: ghcr.io/gjagils/michels:latest
    container_name: squash-team-manager
    restart: unless-stopped
    ports:
      - "${PORT:-8400}:8400"
    volumes:
      - whatsapp-data:/data
    environment:
      - PORT=${PORT:-8400}
      # Google Sheets
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      # WhatsApp
      - GROUP_NAME=${GROUP_NAME}
      - TRAINER_PHONE=${TRAINER_PHONE}
      - TESTER_PHONE=${TESTER_PHONE}
      # Training
      - TRAINING_HOST=${TRAINING_HOST}
      - TRAINING_COST=${TRAINING_COST:-50.00}
      # Schedule (Dag uur:minuut format)
      - POLL_TIME=${POLL_TIME:-Maandag 18:00}
      - REMINDER_TIME=${REMINDER_TIME:-Dinsdag 09:00}
      - SUMMARY_TIME=${SUMMARY_TIME:-Dinsdag 22:00}
      - PAYMENT_TIME=${PAYMENT_TIME:-Woensdag 20:30}
      # Claude AI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # bunq
      - BUNQ_API_KEY=${BUNQ_API_KEY}
      - BUNQ_USER_ID=${BUNQ_USER_ID}
      - BUNQ_ACCOUNT_ID=${BUNQ_ACCOUNT_ID}
      - BUNQ_ENVIRONMENT=${BUNQ_ENVIRONMENT:-sandbox}
      # SBN Scraping
      - SBN_TEAM_URL=${SBN_TEAM_URL}
      - SBN_DRAW_URL=${SBN_DRAW_URL}

volumes:
  whatsapp-data:
